<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bol Şans! ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: 'Trebuchet MS', sans-serif;
    background:linear-gradient(-45deg,#ff9ecb,#ffd1dc,#ffc3e6,#ffe6f2);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    position:relative;
    z-index:20;
    width:650px;
    max-width:90%;
    text-align:center;
    padding:45px;
    border-radius:30px;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,.25);
    border:2px solid rgba(255,255,255,.4);
    box-shadow:0 0 40px rgba(255,120,170,.35);
}

h1{
    color:#ff2f7d;
    font-size:3rem;
    margin-bottom:20px;
    animation:pulse 2s infinite;
}

p{
    color:#5c2a3d;
    font-size:1.35rem;
    line-height:1.8;
}

@keyframes pulse{
    50%{
        transform:scale(1.05);
    }
}

.heart{
    position:absolute;
    color:#ff4f93;
    animation:float linear infinite;
    opacity:.85;
    user-select:none;
}

@keyframes float{
    from{
        transform:translateY(110vh) rotate(0deg);
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
    }
}

.sparkle{
    position:absolute;
    color:white;
    animation:twinkle 2s infinite ease-in-out;
    user-select:none;
    text-shadow:0 0 15px white;
}

@keyframes twinkle{
    0%,100%{
        opacity:.2;
        transform:scale(.4);
    }
    50%{
        opacity:1;
        transform:scale(1.4);
    }
}

.footer{
    margin-top:25px;
    color:#ff2f7d;
    font-size:1.1rem;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

<h1>❤️ Bol Şans! ❤️</h1>

<p>
Hayatımmmm,<br><br>

Sınavında bol şans! 💖<br><br>
</p>

<div class="footer">
Seni Seviyorummm! ❤️
</div>

</div>

<script>

// Floating Hearts
for(let i=0;i<90;i++){

    let heart=document.createElement("div");
    heart.className="heart";

    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(10+Math.random()*40)+"px";

    heart.style.animationDuration=(8+Math.random()*10)+"s";
    heart.style.animationDelay=(-Math.random()*20)+"s";

    heart.style.opacity=Math.random();

    document.body.appendChild(heart);

}

// Sparkles
const stars=["✦","✧","✨","❀","✿","⋆","★"];

for(let i=0;i<70;i++){

    let s=document.createElement("div");
    s.className="sparkle";

    s.innerHTML=stars[Math.floor(Math.random()*stars.length)];

    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";

    s.style.fontSize=(10+Math.random()*20)+"px";
    s.style.animationDelay=Math.random()*2+"s";

    document.body.appendChild(s);

}

</script>

</body>
</html>
