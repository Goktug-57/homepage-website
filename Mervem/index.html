<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İyi Ki Doğdun Sevgilim</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #fff0f3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* The Permanent Message Box - Centered Over the Hearts */
        #permanent-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.94); /* Slight transparency for effect */
            padding: 35px 25px;
            border-radius: 30px;
            width: 85%;
            max-width: 400px; /* Looks good on large phones too */
            box-shadow: 0 20px 60px rgba(201, 24, 74, 0.3);
            z-index: 1000; /* Always on top */
            text-align: center;
            border: 2px solid #ff4d6d;
            backdrop-filter: blur(5px); /* Blurs the hearts behind it */
        }

        #note-title {
            color: #c9184a;
            margin: 0 0 20px 0;
            font-size: 1.8rem;
            font-weight: 800;
        }

        #note-body {
            color: #333;
            font-size: 1.2rem;
            line-height: 1.7;
            font-weight: 500;
            margin: 0;
        }

        /* Subtle pulsating glow for the title emoji */
        .pulse-emoji {
            display: inline-block;
            animation: emojiPulse 1.5s infinite;
        }

        @keyframes emojiPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="permanent-message">
        <h2 id="note-title">İyi Ki Doğdun Aşkımmmmm <span class="pulse-emoji">😘❤️</span></h2>
        <p id="note-body">
            Seni seviyorum güzel kız <3
        </p>
        <div id="hidden-section" style="margin-top: 25px; border-top: 1px dashed #eee; pt: 10px;">
            <p id="trigger-text" onclick="revealSecret()" style="color: #bbb; font-size: 0.75rem; cursor: pointer; margin-top: 10px;">
                Sadece Sen Okuyorsan Tıkla 
            </p>
            <p id="secret-content" style="display: none; color: #c9184a; font-size: 0.9rem; font-weight: bold; margin-top: 10px; animation: fadeIn 0.5s;">
               Bir gün, bugünü sen bir devecik olduktan sonra kutlayacağız. O gün vericeğim hediye bunlarla kıyaslanamaz bile... 😈😈😈
            </p>
        </div>
    </div>

    <script>
        const { Engine, World, Bodies, Body } = Matter;
        let engine, world, hearts = [];
        // Define colors for variety
        let colors = ["#ff4d6d", "#ff758f", "#ff85a1", "#c9184a"];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            engine = Engine.create();
            world = engine.world;
            
            // Set slight gravity automatically
            engine.world.gravity.y = 0.3;
            engine.world.gravity.x = 0.1;

            // Boundaries (slightly reflective)
            let wallOpts = { isStatic: true, friction: 0.1, restitution: 0.9 };
            World.add(world, [
                Bodies.rectangle(width/2, height+25, width, 50, wallOpts), // Floor
                Bodies.rectangle(-25, height/2, 50, height, wallOpts),    // Left
                Bodies.rectangle(width+25, height/2, 50, height, wallOpts) // Right
            ]);

            // CREATE LOTS OF MOVING HEARTS (90)
            for(let i=0; i < 90; i++) {
                let radius = random(15, 30);
                let h = Bodies.circle(random(width), random(-height, 0), radius, {
                    restitution: 0.8, // Bouncy
                    friction: 0.05,
                    frictionAir: 0.01, // Slight air resistance
                    render: { 
                        color: colors[i % colors.length],
                        size: radius * 1.5
                    }
                });
                // Give initial random spin and velocity
                Body.setAngularVelocity(h, random(-0.1, 0.1));
                Body.setVelocity(h, { x: random(-2, 2), y: random(1, 5) });
                
                hearts.push(h);
                World.add(world, h);
            }
        }

        function draw() {
            background("#fff0f3");
            Engine.update(engine);
            
            hearts.forEach(h => {
                // If a heart falls off screen (somehow), reset it to the top
                if (h.position.y > height + 100) {
                    Body.setPosition(h, { x: random(width), y: -50 });
                    Body.setVelocity(h, { x: random(-1, 1), y: random(1, 3) });
                }

                push();
                translate(h.position.x, h.position.y);
                rotate(h.angle);
                
                // Draw heart with assigned color
                fill(h.render.color);
                noStroke();
                drawHeart(0, 0, h.render.size);
                pop();
            });
        }

        function drawHeart(x, y, size) {
            beginShape();
            vertex(x, y);
            bezierVertex(x - size/2, y - size/2, x - size, y + size/3, x, y + size);
            bezierVertex(x + size, y + size/3, x + size/2, y - size/2, x, y);
            endShape(CLOSE);
        }

        window.addEventListener('deviceorientation', (e) => {
            engine.world.gravity.x = e.gamma / 10;
            engine.world.gravity.y = 0.3 + (e.beta / 20); 
        });

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
        
        function revealSecret() {
            if(navigator.vibrate) navigator.vibrate(20);
        
            document.getElementById('trigger-text').style.display = 'none';
            document.getElementById('secret-content').style.display = 'block';
        }
    </script>
</body>
</html>
