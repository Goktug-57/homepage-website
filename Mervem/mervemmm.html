<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERVEMMMMM</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fff5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            color: #d63384;
            margin-bottom: 20px;
            z-index: 10;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .main-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 10px solid #d63384;
            z-index: 10;
            transition: transform 0.3s ease;
            margin-bottom: 20px;
        }

        /* --- New 3D Heart Button --- */
        .heart-container {
            position: relative;
            width: 120px;
            height: 120px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            animation: pulse 1.5s infinite;
        }

        .heart-container:hover {
            transform: scale(1.15);
            animation: none;
        }

        .heart-svg {
            fill: #ff4d6d;
            filter: drop-shadow(0 5px 15px rgba(214, 51, 132, 0.4));
        }

        .btn-text {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- Background Images --- */
        .random-img {
            position: absolute;
            width: 180px; 
            height: 180px;
            object-fit: cover;
            border: 8px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border-radius: 4px;
            opacity: 0.9;
            z-index: 1;
        }

        .img1 { top: 5%; left: 8%; transform: rotate(-12deg); }
        .img2 { top: 12%; right: 5%; transform: rotate(10deg); }
        .img3 { bottom: 8%; left: 5%; transform: rotate(-8deg); }
        .img4 { bottom: 5%; right: 10%; transform: rotate(15deg); }
        .img5 { top: 40%; left: 2%; transform: rotate(5deg); }

        /* --- Particles & Rain --- */
        .heart-particle {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            animation: heart-burst 2.5s ease-out forwards;
        }

        @keyframes heart-burst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.5) rotate(var(--r)); opacity: 0; }
        }

        @keyframes heart-fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body onclick="createHearts(event)">

    <h1>OZR DLRMMM AŞKIMMM BİTANEMMM</h1>
    
    <img src="https://lh3.googleusercontent.com/u/0/d/1QP0PF9-D0rxV40NXReU9J4f_rD94ZoKa" alt="Us" class="main-img">
    
    <div class="heart-container" onclick="handleForgiveness(event)">
        <svg class="heart-svg" viewBox="0 0 32 32" width="120" height="120">
            <path d="M16 28.5L14.1 26.7C7.2 20.4 2.7 16.3 2.7 11.2C2.7 7 6 3.7 10.2 3.7C12.5 3.7 14.8 4.8 16 6.5C17.2 4.8 19.5 3.7 21.8 3.7C26 3.7 29.3 7 29.3 11.2C29.3 16.3 24.8 20.4 17.9 26.7L16 28.5Z" />
        </svg>
        <span class="btn-text">AFFET</span>
    </div>

    <img src="https://lh3.googleusercontent.com/u/0/d/1QIYunjoeiGiKtg6fRmQNIHgRJ-2eiVw_" class="random-img img1">
    <img src="https://lh3.googleusercontent.com/u/0/d/1quEvtKieK_O6-0GmXvIs2npxhbWAr_X-" class="random-img img2">
    <img src="https://lh3.googleusercontent.com/u/0/d/1Y1sfMXyGv778BnooiQkHChjm97-tDwgx" class="random-img img3">
    <img src="https://lh3.googleusercontent.com/u/0/d/1Fw2cN0ewTHL3g73xEhS9aHtlXY89-6sR" class="random-img img4">
    <img src="https://lh3.googleusercontent.com/u/0/d/1rlDum3TAY1Nw-8UbTXz4fB1nKvtw-n0w" class="random-img img5">

    <audio id="romanticSong" preload="auto" loop>
        <source src="only_you.mp3" type="audio/mp3">
    </audio>

    <script>
        function createHearts(e) {
            const count = 10;
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤️';
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                
                const x = (Math.random() - 0.5) * 400 + 'px';
                const y = (Math.random() - 0.8) * 500 + 'px';
                const r = (Math.random() * 360) + 'deg';
                
                heart.style.setProperty('--x', x);
                heart.style.setProperty('--y', y);
                heart.style.setProperty('--r', r);
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 2500);
            }
        }

        function handleForgiveness(e) {
            e.stopPropagation(); // Prevents double burst
            
            // 1. Play Music
            const audio = document.getElementById('romanticSong');
            audio.play().catch(error => console.log("Audio play failed:", error));

            // 2. Initial Burst
            createHearts(e);

            // 3. Start Raining Hearts for 5 seconds
            const end = Date.now() + 5000;
            const interval = setInterval(() => {
                if (Date.now() > end) {
                    clearInterval(interval);
                    return;
                }

                const heart = document.createElement('div');
                heart.innerHTML = ['❤️', '💖', '💕', '✨'][Math.floor(Math.random() * 4)];
                heart.style.position = 'absolute';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-50px';
                heart.style.fontSize = (Math.random() * 20 + 25) + 'px';
                heart.style.zIndex = '100';
                heart.style.animation = `heart-fall ${Math.random() * 2 + 2}s linear forwards`;
                
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 80); 
        }
    </script>
</body>
</html>
